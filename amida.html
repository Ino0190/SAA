<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAA こんな時どっち？</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Yu Gothic','游ゴシック','Noto Sans JP',sans-serif;background:#fafafa;color:#121212;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.app{max-width:600px;width:100%;text-align:center}

/* トップ */
.top h1{font-size:20px;color:#183251;margin-bottom:6px}
.top .sub{font-size:14px;color:#5e5e5e;margin-bottom:24px}
.decks{display:flex;flex-direction:column;gap:10px;text-align:left}
.deck{background:#fff;border:1px solid #c8c2b0;padding:16px 18px;cursor:pointer;font-family:inherit;font-size:17px;color:#183251;font-weight:700;text-align:left;width:100%}
.deck:hover{border-color:#21537f;background:#edf2f4}
.deck .cnt{font-size:13px;color:#5e5e5e;font-weight:400;margin-left:8px}
.deck.todo{opacity:.4;cursor:default;font-weight:400}
.deck.todo:hover{border-color:#c8c2b0;background:#fff}

/* クイズ */
.quiz{display:none;flex-direction:column;align-items:center}
.progress{font-size:13px;color:#5e5e5e;margin-bottom:18px}
.situation{font-size:22px;font-weight:700;color:#121212;margin-bottom:28px;line-height:1.5;text-align:center}
.choices{display:flex;flex-direction:column;gap:12px;width:100%}
.ch{background:#fff;border:2px solid #c8c2b0;padding:16px 20px;cursor:pointer;font-family:inherit;font-size:18px;color:#183251;font-weight:700;text-align:center;transition:all .15s}
.ch:hover{border-color:#21537f;background:#edf2f4;transform:scale(1.02)}
.ch:active{transform:scale(.98)}

/* 結果 */
.result{display:none;flex-direction:column;align-items:center}
.res-icon{font-size:48px;margin-bottom:12px}
.res-text{font-size:20px;font-weight:700;margin-bottom:6px}
.res-text.ok{color:#183251}
.res-text.ng{color:#b01212}
.res-ans{font-size:16px;color:#5e5e5e;margin-bottom:8px}
.res-why{font-size:15px;color:#121212;margin-bottom:24px;line-height:1.6;text-align:left;background:#faf9f5;padding:14px 16px;border-left:4px solid #21537f;width:100%}
.res-why b{color:#183251}
.nextbtn{background:#21537f;color:#fff;border:none;padding:14px 32px;font-size:16px;cursor:pointer;font-family:inherit;font-weight:700}
.nextbtn:hover{background:#162a42}

/* スコア */
.score{display:none;flex-direction:column;align-items:center}
.score-num{font-size:42px;font-weight:700;color:#183251;margin-bottom:8px}
.score-sub{font-size:16px;color:#5e5e5e;margin-bottom:24px}
.score-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.score-btns button{padding:12px 22px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:700;border:none}
.score-btns .retry{background:#21537f;color:#fff}
.score-btns .retry:hover{background:#162a42}
.score-btns .back{background:#fafafa;color:#21537f;border:1px solid #c8c2b0}
.score-btns .back:hover{background:#edf2f4}

.hide{display:none}
</style>
</head>
<body>
<div class="app">
  <nav style="display:flex;gap:6px;margin:0 0 16px;padding:8px 0;flex-wrap:wrap">
    <a href="index.html" style="flex:1;text-align:center;font-size:13px;font-weight:700;color:#5e5e5e;background:#fff;border:1px solid #c8c2b0;padding:8px 4px;text-decoration:none;min-width:60px">🎯 ドリル</a>
    <a href="cards.html" style="flex:1;text-align:center;font-size:13px;font-weight:700;color:#5e5e5e;background:#fff;border:1px solid #c8c2b0;padding:8px 4px;text-decoration:none;min-width:60px">📇 暗記帳</a>
    <a href="amida.html" style="flex:1;text-align:center;font-size:13px;font-weight:700;color:#121212;background:#edf2f4;border:1px solid #21537f;padding:8px 4px;text-decoration:none;min-width:60px">⚡ どっち</a>
    <a href="network-zukai.html" style="flex:1;text-align:center;font-size:13px;font-weight:700;color:#5e5e5e;background:#fff;border:1px solid #c8c2b0;padding:8px 4px;text-decoration:none;min-width:60px">🧭 図解</a>
    <a href="mock-exam.html" style="flex:1;text-align:center;font-size:13px;font-weight:700;color:#5e5e5e;background:#fff;border:1px solid #c8c2b0;padding:8px 4px;text-decoration:none;min-width:60px">📝 模試</a>
  </nav>
  <div class="top" id="top">
    <h1>こんな時どっち？</h1>
    <div class="sub">2択で答える。電車で10秒ずつ。</div>
    <div class="decks" id="decks"></div>
  </div>
  <div class="quiz" id="quiz">
    <div class="progress" id="progress"></div>
    <div class="situation" id="situation"></div>
    <div class="choices" id="choices"></div>
  </div>
  <div class="result" id="result">
    <div class="res-icon" id="res-icon"></div>
    <div class="res-text" id="res-text"></div>
    <div class="res-ans" id="res-ans"></div>
    <div class="res-why" id="res-why"></div>
    <button class="nextbtn" id="nextbtn">次へ</button>
  </div>
  <div class="score" id="score">
    <div class="score-num" id="score-num"></div>
    <div class="score-sub" id="score-sub"></div>
    <div class="score-btns">
      <button class="retry" id="score-wrong" style="background:#b01212;display:none">❌ 間違えたやつだけ</button>
      <button class="retry" id="score-retry">もう一度</button>
      <button class="back" id="score-back">別のデッキ</button>
    </div>
  </div>
</div>
<script>
const decks = {
  'compute': {
    name: '💻 コンピュートの選び方',
    cards: [
      {s:'コンテナを使いたいがEC2を管理したくない',a:'ECS on Fargate',b:'ECS on EC2',ans:'a',why:'Fargate=<b>サーバー管理ゼロ</b>。EC2起動タイプは自分で管理。'},
      {s:'15分以内で終わるイベント駆動の処理',a:'Lambda',b:'EC2',ans:'a',why:'Lambda=<b>イベント駆動・サーバーレス</b>。15分制限あり。'},
      {s:'数時間かかる動画エンコード',a:'Lambda',b:'AWS Batch',ans:'b',why:'Lambda=15分制限。Batch=<b>長時間バッチ処理</b>。'},
      {s:'コードだけ渡して環境一式を自動構築',a:'Elastic Beanstalk',b:'CloudFormationでEC2/ELB/ASGを自分で定義',ans:'a',why:'Beanstalk=<b>コードを渡すだけで環境一式を自動構築</b>。CloudFormationは自分でリソースを定義する必要がある。'},
      {s:'波のあるトラフィックに自動で増減',a:'Auto Scaling',b:'大きいインスタンスに変更',ans:'a',why:'Auto Scaling=<b>水平スケール</b>。スケールアップは上限あり。'},
      {s:'常時必要なベース＋上乗せを安く',a:'全部スポット',b:'オンデマンド＋スポット混在',ans:'b',why:'混在=<b>安定＋コスト最適化</b>。全スポットは追い出しリスク。'},
      {s:'Step Functions:IoT 10万/秒・5分以内',a:'Standard',b:'Express',ans:'b',why:'Express=<b>高頻度・短時間・安い</b>。Standardは長時間/監査向き。'},
      {s:'Step Functions:長時間ワークフロー・監査証跡',a:'Standard',b:'Express',ans:'a',why:'Standard=<b>最大1年・Exactly-once・状態遷移記録</b>。'},
      {s:'Kinesisのチェックポイントをカスタム制御したい',a:'Lambda',b:'ECS + KCL（Kinesis Client Library）',ans:'b',why:'Lambda=チェックポイント自動管理。<b>KCL（Kinesis Client Library）=アプリ側で任意位置制御可</b>。'},
      {s:'S3はサーバーレス？',a:'はい',b:'いいえ',ans:'a',why:'管理不要・使った分だけ課金・自動スケール=<b>サーバーレス</b>。'},
      {s:'RDSはサーバーレス？',a:'はい',b:'いいえ',ans:'b',why:'RDS=インスタンス常時起動=<b>非サーバーレス</b>。（Aurora Serverless v2は例外）'},
      {s:'ElastiCacheはサーバーレス？',a:'はい',b:'いいえ',ans:'b',why:'ノード常時起動=<b>非サーバーレス</b>。'},
      {s:'Fargateはサーバーレス？',a:'はい',b:'いいえ',ans:'a',why:'Fargate=EC2管理なし・タスク単位課金=<b>サーバーレス</b>。'},
      {s:'Lambda + RDS の構成は全体としてサーバーレス？',a:'はい',b:'いいえ',ans:'b',why:'裏のRDSが常時課金。<b>全部サーバーレスか</b>で判定。'},
      {s:'「サーバーレスでSQL分析」と来たら？',a:'Lambda',b:'Athena',ans:'b',why:'Athena=<b>サーバーレスSQLエンジン</b>。LambdaはSQLエンジンを持たない。'},
      {s:'API Gateway + Lambda + DynamoDB は？',a:'サーバーレス鉄板',b:'非サーバーレス',ans:'a',why:'3つとも管理不要・使った分だけ=<b>鉄板構成</b>。'},
      {s:'「CPU使用率を常に50%に保つ」ように自動調整',a:'ターゲット追跡（Target Tracking）',b:'ステップスケーリング',ans:'a',why:'ターゲット追跡=<b>目標値を維持するよう自動増減</b>。最も簡単で推奨。'},
      {s:'「アラームの超過幅に応じて段階的に」台数を増やす',a:'ターゲット追跡',b:'ステップスケーリング',ans:'b',why:'ステップ=<b>逸脱の大きさで増分を変える</b>細かい制御。'},
      {s:'「毎週月曜9時にアクセス増」が分かっている',a:'スケジュールドスケーリング',b:'ターゲット追跡',ans:'a',why:'スケジュール=<b>決まった時刻に事前増減</b>。反応型では立ち上がりが間に合わない。'},
      {s:'過去傾向から「未来の需要を予測して」先回りで増やす',a:'予測スケーリング（Predictive）',b:'ステップスケーリング',ans:'a',why:'予測スケーリング=<b>MLで需要予測し事前プロビジョン</b>。急な立ち上がりに強い。'},
      {s:'スケールインで「消したくないインスタンスを守る」',a:'スケールイン保護',b:'クールダウン',ans:'a',why:'スケールイン保護=<b>特定インスタンスを削除対象から除外</b>。クールダウンは連続動作の待ち時間。'},
    ]
  },
  'storage': {
    name: '🗄 ストレージの選び方',
    cards: [
      {s:'月1回しかアクセスしない安いS3',a:'S3 Standard',b:'S3 Standard-IA',ans:'b',why:'IA=<b>低頻度</b>。保管安い＋取り出し有料。'},
      {s:'アクセス頻度が読めない',a:'S3 Intelligent-Tiering',b:'S3 Standard-IAに固定する',ans:'a',why:'Intelligent-Tiering=<b>アクセス頻度に応じ自動移動</b>。IA固定は頻繁アクセスだと取り出し料で割高になりうる。'},
      {s:'7-10年保管・年1回取り出し',a:'Glacier Deep Archive',b:'S3 Standard-IA',ans:'a',why:'Deep Archive=<b>最安・12時間復元</b>。規制対応の長期保管。'},
      {s:'EC2のブートディスク',a:'EBS（Elastic Block Store）',b:'EFS（Elastic File System）',ans:'a',why:'EBS=<b>EC2直付け</b>（1対1）。EFSは共有ファイルシステム。'},
      {s:'複数EC2から同時に読み書き',a:'EBS（Elastic Block Store）',b:'EFS（Elastic File System）',ans:'b',why:'EFS=<b>共有</b>（NFS）。EBSは基本1台のみ。'},
      {s:'オンプレのファイルサーバーを残しつつ、裏でS3にデータを同期したい',a:'Storage Gateway',b:'DataSync',ans:'a',why:'Storage Gateway=<b>オンプレにキャッシュ</b>を残しつつS3に。DataSyncは転送/同期。'},
      {s:'オンプレのデータをS3にまとめて引っ越したい（移行目的）',a:'Storage Gateway',b:'DataSync',ans:'b',why:'DataSync=<b>転送・同期</b>が仕事。Gatewayは常設キャッシュ。'},
      {s:'既存バケットにS3 Object Lockを後から有効化できる？',a:'できる',b:'できない（作成時のみ）',ans:'b',why:'Object Lock=<b>バケット作成時のみ</b>有効化可能。後付け不可。'},
      {s:'普通のDB・Webサーバーに安定した性能を安く',a:'gp3（汎用SSD）',b:'io2（プロビジョンドIOPS）',ans:'a',why:'gp3=<b>大半のワークロードに十分・コスパ最良</b>。io2は高い。'},
      {s:'決済DBで一瞬の遅延も許されない・最高IOPS',a:'gp3（汎用SSD）',b:'io2 Block Express',ans:'b',why:'io2=<b>サブミリ秒・最高IOPS</b>。ミッションクリティカル用。'},
      {s:'大容量ログのシーケンシャル読み書き（安く）',a:'st1（スループットHDD）',b:'gp3（汎用SSD）',ans:'a',why:'st1=<b>シーケンシャル・高スループット・安いHDD</b>。'},
      {s:'めったにアクセスしないコールドデータ（最安HDD）',a:'st1（スループットHDD）',b:'sc1（Cold HDD）',ans:'b',why:'sc1=<b>最安HDD・めったに触らない</b>。st1は頻繁に読む。'},
      {s:'EC2停止してもデータは残る？',a:'EBS=残る',b:'インスタンスストア=消える',ans:'a',why:'EBS=<b>永続</b>。インスタンスストア=停止で消える。'},
      {s:'一時データ・スクラッチ用で超低レイテンシ（消えてOK）',a:'EBS（Elastic Block Store）',b:'インスタンスストア',ans:'b',why:'インスタンスストア=<b>ホスト直結・超高速・揮発</b>。'},
      {s:'複数AZにまたがって自動で冗長化されるファイルシステムは？',a:'EBS',b:'EFS',ans:'b',why:'EFS=<b>複数AZに自動冗長・複数EC2から共有</b>。EBSは<b>単一AZ</b>に閉じる。'},
      {s:'EBSボリュームはAZをまたげる？',a:'またげる',b:'またげない（単一AZ・別AZはスナップショット経由）',ans:'b',why:'EBS=<b>単一AZ</b>。別AZで使うにはスナップショットから作り直す。'},
      {s:'EC2を停止(Stop)するとデータが消えるのは？',a:'EBS',b:'インスタンスストア',ans:'b',why:'インスタンスストア=<b>停止で揮発</b>（ホスト直結の使い捨て）。EBSは永続。'},
      {s:'S3の「99.999999999%(11 9s)」は何を表す？',a:'耐久性（データが失われない）',b:'可用性（アクセスできる）',ans:'a',why:'11 9s=<b>耐久性(durability)</b>。可用性(availability)はクラスにより99.9〜99.99%で別物。'},
      {s:'EFSを最も安くするには（低頻度アクセス）？',a:'EFS標準のまま',b:'EFS-IA + ライフサイクル自動移行',ans:'b',why:'EFS-IA=<b>低頻度クラスへ自動移行して節約</b>。S3のIAと同じ発想。'},
    ]
  },
  'database': {
    name: '🗃 データベースの選び方',
    cards: [
      {s:'JOINが必要なリレーショナルデータ',a:'RDS/Aurora',b:'DynamoDB',ans:'a',why:'RDS=<b>SQL・JOIN・トランザクション</b>。'},
      {s:'キーで一発取り出し・ミリ秒未満',a:'RDS',b:'DynamoDB',ans:'b',why:'DynamoDB=<b>キーバリュー・超高速</b>。'},
      {s:'DynamoDBの読み込みをもっと速く',a:'DAX（DynamoDB Accelerator）',b:'ElastiCache',ans:'a',why:'DAX=<b>DynamoDB専用</b>キャッシュ。'},
      {s:'RDSの読み込みを分散したい',a:'リードレプリカ',b:'マルチAZ',ans:'a',why:'リードレプリカ=<b>読み取り分散</b>。マルチAZ=可用性（フェイルオーバー）。'},
      {s:'RDSが落ちても自動復旧（可用性）',a:'リードレプリカ',b:'マルチAZ',ans:'b',why:'マルチAZ=<b>自動フェイルオーバー</b>。読み取り分散ではない。'},
      {s:'世界中で読み書き両方高速',a:'DynamoDB Global Tables',b:'DAX（DynamoDB Accelerator）',ans:'a',why:'Global Tables=<b>マルチリージョン読み書き</b>。DAX=読みだけ・単一リージョン。'},
      {s:'グラフDB（人間関係・ネットワーク）',a:'Neptune',b:'DynamoDB',ans:'a',why:'Neptune=<b>グラフ</b>（ノードとエッジ）。'},
      {s:'全文検索・ログ分析',a:'OpenSearch',b:'RDS',ans:'a',why:'OpenSearch=<b>全文検索・分析</b>。RDSはLIKE程度。'},
      {s:'DynamoDB TTLの削除にWCU(書き込み容量)は消費される？',a:'される',b:'されない（無料）',ans:'b',why:'TTL削除は<b>無料</b>。WCU消費なし。48時間のズレあり。'},
      {s:'RDB(PostgreSQL/MySQL互換)で、アイドル時ほぼ課金ゼロ・自動スケール',a:'Aurora Serverless v2',b:'DynamoDBオンデマンド',ans:'a',why:'Aurora Serverless v2=<b>RDBのまま自動スケール</b>。SQL/JOINが要るならこちら。'},
      {s:'キーバリューNoSQLで、容量計画なし・使った分だけ',a:'Aurora Serverless v2',b:'DynamoDBオンデマンド',ans:'b',why:'DynamoDBオンデマンド=<b>NoSQLでキャパシティ計画不要</b>。急なスパイクにも自動追従。'},
      {s:'DynamoDBで「予測可能な安定した高トラフィック」を最安にするには',a:'オンデマンド',b:'プロビジョンド + Auto Scaling',ans:'b',why:'安定高負荷=<b>プロビジョンド(予約)が単価安い</b>。オンデマンドは変動・読めない時向け。'},
      {s:'Aurora Serverless v2は0までスケールダウンする？',a:'0.5 ACUが下限（完全に0にはならない）',b:'0まで落ちて無課金',ans:'a',why:'v2は<b>最小0.5 ACU</b>常時。完全ゼロ停止は旧v1の挙動で、v2は即応性重視で下限あり。'},
      {s:'MongoDBアプリをコード変更最小でマネージドに移したい',a:'DocumentDB(MongoDB互換)',b:'DynamoDB',ans:'a',why:'DocumentDB＝<b>MongoDB互換でドライバ/クエリそのまま</b>。DynamoDBはAPI書き換えが要る。'},
      {s:'Cassandra(CQL)アプリをコード変更最小でマネージドに移したい',a:'DynamoDB',b:'Keyspaces(Cassandra互換)',ans:'b',why:'Keyspaces＝<b>Apache Cassandra(CQL)互換でそのまま移行</b>。DynamoDBは独自APIで書き換えが要る。'},
      {s:'Redis互換で「インメモリの速さ」と「データ永続性・耐久性」を両立しプライマリDBとして使いたい',a:'ElastiCache for Redis',b:'MemoryDB for Redis',ans:'b',why:'MemoryDB＝<b>Redis互換＋マルチAZの永続性でプライマリDBになれる</b>。ElastiCacheは基本キャッシュ用途。'},
      {s:'ElastiCacheで「レプリカ・自動フェイルオーバー・スナップショット」など高度な機能が要る',a:'Memcached',b:'Redis',ans:'b',why:'Redis＝<b>レプリケーション/フェイルオーバー/永続化/データ構造が豊富</b>。Memcachedは<b>単純・マルチスレッドのキャッシュ</b>で高度機能なし。'},
      {s:'関係性(友達の友達・レコメンド)を多段でたどる高速クエリ',a:'Neptune(グラフDB)',b:'RDSのJOIN',ans:'a',why:'Neptune＝<b>グラフで多段の関係探索が速い</b>。RDBのJOINは多段で結合爆発し劣化。'},
      {s:'IoT計測値など時刻付きデータの時間範囲集計と自動階層化',a:'Timestream',b:'DynamoDB',ans:'a',why:'Timestream＝<b>時系列専用・時間集計・自動階層化</b>。DynamoDBは汎用KVで時系列集計は不得手。'},

      {s:'オンプレのNetApp/ONTAP機能（クローン・重複排除）をそのままAWSで使いたい',a:'Amazon EFS',b:'FSx for NetApp ONTAP',ans:'b',why:'FSx for NetApp ONTAP＝<b>NFS/SMB両対応＋ONTAP機能をそのまま移行</b>。EFSはNFS専用でONTAP機能を持たない。'},
      {s:'取引先の既存SFTPクライアントはそのまま、自前SFTPサーバー運用はやめたい',a:'EC2にSFTPサーバーを構築しAuto Scalingで冗長化',b:'AWS Transfer Family',ans:'b',why:'Transfer Family＝<b>マネージドSFTPエンドポイント・直接S3保存でサーバー運用不要</b>。EC2構築は冗長化してもOS/パッチ運用が残る。'},
      {s:'数千台規模の大規模移行で、依存関係の自動発見と複数移行ツールの進捗を一元管理したい',a:'移行ツールごとに個別のダッシュボードで進捗管理',b:'Application Discovery Service＋Migration Hub',ans:'b',why:'Discovery Service＝<b>依存関係を自動棚卸し</b>、Migration Hub＝<b>複数ツールの進捗を横断一元管理</b>。個別ダッシュボードは大規模で全体像が見えない。'},
      {s:'大量のトランザクションメールを到達率管理・送信認証込みで送りたい',a:'Amazon SNS（Eメール）',b:'Amazon SES',ans:'b',why:'SES＝<b>到達率・バウンス/苦情管理・SPF/DKIM/DMARC対応の本格メール送信</b>。SNSのEメールは簡易な通知向け。'},
      {s:'S3を非公開のまま、CloudFront経由でのみ配信させたい（直リンク防止）',a:'S3バケットポリシーで公開設定',b:'Origin Access Control（OAC）',ans:'b',why:'OAC＝<b>CloudFront経由のみアクセス許可・S3は非公開のまま</b>。バケット公開は誰でも直接アクセス可能になり危険。'},
      {s:'コスト・性能・セキュリティ・上限などを「横断チェックしてベストプラクティス助言」',a:'Trusted Advisor',b:'Well-Architected Tool',ans:'a',why:'Trusted Advisor=<b>5本柱の自動チェック＆推奨</b>（即時アクション向け）。'},
      {s:'設計を6本柱の質問に沿って「レビューして改善点を洗い出す」',a:'Trusted Advisor',b:'Well-Architected Tool',ans:'b',why:'WA Tool=<b>質問形式で設計をレビュー</b>しリスクを可視化（設計工程向け）。'},
      {s:'EC2/EBS/Lambda等の「適正サイズ（右サイジング）」をMLで提案',a:'Compute Optimizer',b:'Trusted Advisor',ans:'a',why:'Compute Optimizer=<b>使用実績からリソースの最適サイズを推奨</b>。過剰/過小を是正。'},
      {s:'コスト配分やRI/SP購入推奨を「可視化・分析」したい',a:'Cost Explorer',b:'Compute Optimizer',ans:'a',why:'Cost Explorer=<b>コストの可視化・傾向分析・購入推奨</b>。リソースサイズ最適化はCompute Optimizer。'},
      {s:'承認済みの構成(テンプレート)をカタログ化し、各チームに権限を絞ってセルフサービスで払い出す',a:'AWS Service Catalog',b:'広範なIAM権限を付与',ans:'a',why:'Service Catalog＝<b>承認済みプロダクトを統制付きセルフサービス化</b>。広範な権限付与はガバナンスが効かない。'},
      {s:'AWSのSOC/ISOなど第三者監査レポートや認証を正式に入手したい',a:'AWS Artifact',b:'CloudTrail',ans:'a',why:'AWS Artifact＝<b>コンプライアンスレポート/認証の取得窓口</b>。CloudTrailはAPI操作ログで別物。'},
      {s:'ベストプラクティスに沿ったマルチアカウント基盤(ログ集約・ガードレール・SSO)を自動構築したい',a:'AWS Organizations単体',b:'AWS Control Tower',ans:'b',why:'Control Tower＝<b>Organizationsの上にガードレール/ログ/SSO込みの標準環境を自動構築</b>。Organizations単体は束ねるだけ。'},
      {s:'エッジで超軽量・高頻度な処理(ヘッダー操作・リダイレクト)を最小コストで実行',a:'CloudFront Functions',b:'Lambda@Edge',ans:'a',why:'CloudFront Functions＝<b>超軽量・高頻度・低コストのエッジ処理</b>。Lambda@Edgeはより重い処理・外部アクセス向け。'},
      {s:'エッジでより重い処理や外部ネットワークアクセスを伴うロジックを実行',a:'CloudFront Functions',b:'Lambda@Edge',ans:'b',why:'Lambda@Edge＝<b>重い処理・外部アクセス可</b>。CloudFront Functionsはヘッダー操作等の軽量処理限定。'}
    ]
  },
  'exam-traps': {
    name: '🔥 試験の罠・ひっかけ',
    cards: [
      {s:'ユーザーを「最も遅延の少ない」リージョンへ振り分ける',a:'レイテンシールーティング',b:'位置情報（Geolocation）ルーティング',c:'加重（Weighted）ルーティング',ans:'a',why:'決め手は<b>遅延が最小</b>＝レイテンシー。Geolocation＝<b>アクセス元の国/地域</b>で固定。Weighted＝<b>割合</b>（カナリア配信）。'},
      {s:'「日本からは日本語サイト、米国は英語サイト」へ出し分け',a:'レイテンシールーティング',b:'位置情報（Geolocation）ルーティング',c:'フェイルオーバールーティング',ans:'b',why:'決め手は<b>国/地域で出し分け</b>＝Geolocation。レイテンシーは速さ基準。フェイルオーバーは障害時にDRへ。'},
      {s:'ストリームデータを「コードなし」でS3/Redshiftへロード',a:'Kinesis Data Streams',b:'Kinesis Data Firehose',c:'Managed Service for Apache Flink',ans:'b',why:'Firehose＝<b>フルマネージドで宛先へ配送（ニアリアルタイム・コード不要）</b>。Data Streams＝<b>自前でコンシューマ実装・保持</b>。Flink＝<b>ストリームにSQL/集計</b>。'},
      {s:'DynamoDBの読み取りを「マイクロ秒」に高速化',a:'ElastiCache for Redis',b:'DAX（DynamoDB Accelerator）',c:'CloudFront',ans:'b',why:'DAX＝<b>DynamoDB専用インメモリ・マイクロ秒</b>。ElastiCacheは<b>汎用（RDB結果/セッション）</b>。CloudFrontは静的配信。'},
      {s:'RDBのクエリ結果やセッションをキャッシュして負荷軽減',a:'ElastiCache for Redis',b:'DAX（DynamoDB Accelerator）',c:'S3',ans:'a',why:'ElastiCache＝<b>汎用インメモリ（RDB結果/セッション/ランキング）</b>。DAXは<b>DynamoDB専用</b>。'},
      {s:'1つのイベントを「複数の購読先へ同時配信」（ファンアウト）',a:'SQS',b:'SNS',c:'EventBridge',ans:'b',why:'SNS＝<b>pub/sub・1対多ファンアウト</b>。SQS＝<b>1対1キュー・順番処理</b>。EventBridge＝<b>多数のイベント源をルールでルーティング</b>。'},
      {s:'「SaaSや多数のAWSサービスのイベント」をルールで振り分け',a:'SQS',b:'SNS',c:'EventBridge',ans:'c',why:'EventBridge＝<b>イベントバス・ルールでフィルタ/ルーティング・スケジュール</b>。SNSは単純通知、SQSはキュー。'},
      {s:'DBの認証情報を「自動ローテーション」しながら安全に保管',a:'Secrets Manager',b:'Systems Manager Parameter Store',c:'KMS',ans:'a',why:'Secrets Manager＝<b>自動ローテーション内蔵（有料）</b>。Parameter Store＝<b>設定値/平文を無料で（ローテーションは自前）</b>。KMSは<b>鍵管理</b>。'},
      {s:'アプリの設定値・環境変数を「無料で」一元管理',a:'Secrets Manager',b:'Systems Manager Parameter Store',c:'KMS',ans:'b',why:'Parameter Store＝<b>無料・設定値/平文/SecureString</b>。Secrets Managerは<b>自動ローテーション込みで有料</b>。'},
      {s:'数百ノードを「ラック障害から分離しつつ」大規模分散（HDFS/Cassandra）',a:'クラスタープレイスメントグループ',b:'スプレッドプレイスメントグループ',c:'パーティションプレイスメントグループ',ans:'c',why:'パーティション＝<b>大規模分散・ラック単位で障害分離</b>。クラスター＝<b>同一ラックで最低遅延</b>。スプレッド＝<b>少数を個別ハードに分散</b>。'},
      {s:'S3暗号化で「誰がいつ鍵を使ったか監査＋鍵ローテーション」',a:'SSE-S3',b:'SSE-KMS',c:'SSE-C',ans:'b',why:'SSE-KMS＝<b>CloudTrailで鍵使用を監査・ローテーション可</b>。SSE-S3＝<b>AWS任せで一番簡単（監査は弱い）</b>。SSE-C＝<b>鍵を自分で持ち込み毎回渡す</b>。'},
      {s:'オンプレからS3を「NFS/SMBのファイル共有」として使う',a:'File Gateway',b:'Volume Gateway',c:'Tape Gateway',ans:'a',why:'File GW＝<b>NFS/SMB→S3</b>。Volume GW＝<b>iSCSIブロック</b>。Tape GW＝<b>仮想テープ（バックアップ）→Glacier</b>。'},
      {s:'「数十TBを、回線が細い/期限内に」一度だけAWSへ移す',a:'DataSync（ネット経由）',b:'Snowball（物理輸送）',c:'Storage Gateway',ans:'b',why:'回線が細い/大容量/期限＝<b>物理輸送のSnowball</b>。DataSync＝<b>回線が太く継続同期</b>向け。Storage GWはハイブリッド常用。'},
      {s:'「専有ハードウェア・自社単独で鍵を完全管理（FIPS 140-2 Lv3）」',a:'KMS（Key Management Service）',b:'CloudHSM',ans:'b',why:'CloudHSM＝<b>専有HSM・顧客が単独管理</b>。KMS＝<b>マネージド・マルチテナント</b>で大半はこれで十分。「専有/単独管理」が決め手。'},
      {s:'「非HTTP（TCP/UDP）」を固定IPで・低遅延に世界中から',a:'CloudFront',b:'Global Accelerator',ans:'b',why:'GA＝<b>L4・固定エニーキャストIP・任意のTCP/UDP</b>。CloudFront＝<b>HTTP(S)の静的/動的キャッシュ配信</b>。プロトコルが決め手。'},
      {s:'アプリのサインイン後に「AWSリソースへの一時クレデンシャル」を発行',a:'Cognito ユーザープール',b:'Cognito IDプール（フェデレーテッドアイデンティティ）',ans:'b',why:'IDプール＝<b>認証後にAWSへの一時認証情報を払い出す</b>。ユーザープール＝<b>サインイン/ユーザーディレクトリ</b>。'},
      {s:'拠点間を「暗号化して」「今すぐ」繋ぐ',a:'Site-to-Site VPN',b:'Direct Connect',ans:'a',why:'決め手は<b>暗号化・今すぐ</b>。VPN=即日・ネット経由で暗号。DXは物理敷設に数週間＋標準では暗号化なし。立派な名前のDXに釣られない。'},
      {s:'2つのVPCを1対1で繋ぐ「だけ」',a:'VPCピアリング',b:'Transit Gateway',ans:'a',why:'決め手は<b>2つだけ</b>。ピアリング=1対1で十分・安い。TGWは多数VPCのハブ集約用で<b>オーバースペック</b>。'},
      {s:'「単一リージョン内」でRDSの「読み取り」負荷を分散',a:'リードレプリカ',b:'Aurora Global Database',ans:'a',why:'決め手は<b>単一リージョン・読み取り</b>。リードレプリカで足りる。Global Databaseは別リージョン災対用の<b>過剰</b>。'},
      {s:'SQSの「空ポーリングのAPI課金」の無駄を減らす',a:'ロングポーリング',b:'ショートポーリング',ans:'a',why:'ロングポーリング=<b>メッセージが来るまで待って空応答を減らす</b>＝APIコール削減。ショートは即空返答で無駄打ちが増える。'},
      {s:'オンプレADのユーザーで「AWSコンソールにSSO」（SAML連携）',a:'IAM Identity Center（SAMLフェデレーション）',b:'各AWSアカウントにIAMロールを個別作成',ans:'a',why:'決め手は<b>既存ADでSSO</b>。Identity Center＋SAMLで一時認証・一元管理。アカウントごとに個別ロールを作るとSSOにならず管理が分散する。Cognitoはアプリ利用者(toC)用で別物。'},
      {s:'「年1回」しか取り出さない「最安」アーカイブ',a:'Glacier Deep Archive',b:'Glacier Instant Retrieval',ans:'a',why:'決め手は<b>年1・最安</b>。Deep Archive=最安・復元12時間。Instant Retrievalは<b>即時取り出し</b>が要るとき用で割高。'},
      {s:'「中断されると困る」本番Webサーバー',a:'オンデマンド / Reserved',b:'スポットインスタンス',ans:'a',why:'決め手は<b>中断NG</b>。スポットは最大90%安いが2分前通知で<b>追い出される</b>＝本番Web不可。「安い」に釣られない。'},
      {s:'「OS・ミドルウェアまで自社で細かく管理」したいDB',a:'EC2上に自前でDB構築',b:'RDS（マネージド）',ans:'a',why:'決め手は<b>OSまで自社管理</b>。マネージドはOSに触れない→要件を満たすのはEC2自前構築だけ。「マネージドが正解」の思い込みを外す。'},
      {s:'S3への「上り(アップロード)」を速くしたい',a:'CloudFront',b:'S3 Transfer Acceleration',ans:'b',why:'CloudFront=<b>下り(配信)</b>専門。上り高速化は<b>Transfer Acceleration</b>。'},
      {s:'オンプレのAD(Active Directory)をAWSに移したい',a:'AWS Managed Microsoft AD',b:'Cognito',ans:'a',why:'Managed AD=<b>社内AD互換</b>。Cognito=アプリのエンドユーザー(toC)認証。'},
      {s:'社員の複数AWSアカウントへのSSO',a:'IAM Identity Center',b:'Cognito',ans:'a',why:'Identity Center=<b>社員のAWSログインSSO</b>。Cognito=アプリ利用者。'},
      {s:'Windowsファイルサーバー(SMB)をAWSへ',a:'EFS（Elastic File System）',b:'FSx for Windows',ans:'b',why:'EFS=Linux NFS。<b>FSx for Windows=SMB/NTFS/AD統合</b>。'},
      {s:'HPC(高性能計算)用の超高スループットファイルシステム',a:'EFS（Elastic File System）',b:'FSx for Lustre',ans:'b',why:'Lustre=<b>数百GB/秒級・HPC/ML向け</b>。EFSは汎用NFS。'},
      {s:'インスタンスストアのデータはEC2停止で？',a:'残る',b:'消える',ans:'b',why:'インスタンスストア=<b>停止で消える</b>使い捨て。永続はEBS。'},
      {s:'Aurora Global Database は読み書き両方を別リージョンで？',a:'はい',b:'いいえ（読み取りだけ）',ans:'b',why:'Global DB=<b>書き込みは1リージョン</b>。読み書き両方別リージョンはDynamoDB Global Tables。'},
      {s:'「予約済み同時実行(Reserved)」でコスト削減できる？',a:'できる',b:'できない（枠確保するだけ）',ans:'b',why:'Reserved Concurrency=<b>上限設定</b>。コスト削減はしない。Provisioned Concurrencyと混同する罠。'},
      {s:'Config vs Security Hub',a:'Config=個々の設定を評価',b:'Security Hub=検出結果を集約',ans:'a',why:'両方正解の説明だが<b>問われ方が違う</b>。Configは継続評価、Security Hubは複数サービスの結果を1画面に。'},
      {s:'GuardDuty vs Inspector',a:'GuardDuty=脅威検知(攻撃の動き)',b:'Inspector=脆弱性スキャン(弱点)',ans:'a',why:'GuardDuty=<b>不審な動きを検知</b>。Inspector=<b>EC2/コンテナのCVE脆弱性を検査</b>。'},
      {s:'Macie vs GuardDuty',a:'Macie=S3の機密データ(PII)検出',b:'GuardDuty=S3の不審アクセス検知',ans:'a',why:'Macie=<b>個人情報を探す鑑定士</b>。GuardDuty=不正アクセスの見回り。'},
      {s:'Control Tower vs Organizations',a:'Control Tower=ガードレール＋環境自動構築',b:'Organizations=アカウントを束ねる土台',ans:'b',why:'<b>両方正解だが主語が違う</b>。Organizations=束ねるだけ。Control Tower=その上にログ/ガードレール/SSO込みの標準環境を自動構築。'},
      {s:'CloudTrailの「管理イベント」はデフォルトON？',a:'はい',b:'いいえ（手動で有効化が要る）',ans:'a',why:'管理イベント=<b>デフォルトON</b>。データイベント(S3 GetObject等)は明示的に有効化が要る。'},
      {s:'DynamoDB Streams vs TTL、どっちが「変更検知」？',a:'Streams',b:'TTL',ans:'a',why:'Streams=<b>イベントベース(変更検知)</b>。TTL=<b>時間ベース(期限切れ削除)</b>。'},
      {s:'VPC Lattice vs Transit Gateway',a:'VPC Lattice=L7・マイクロサービス間通信',b:'Transit Gateway=L3・VPC/オンプレ接続のハブ',ans:'a',why:'Lattice=<b>L7ビル受付</b>。TGW=<b>L3駅ターミナル</b>。層が違う。'},
      {s:'「セッション共有・ホットデータのキャッシュ」',a:'ElastiCache（Redis）',b:'DynamoDB',ans:'a',why:'ElastiCache=<b>インメモリ・マイクロ秒</b>。セッション/ランキング/キャッシュはRedisの出番。'},
      {s:'GuardDutyが検知した後「なぜ/誰が関与」を調査',a:'Inspector',b:'Detective',ans:'b',why:'Detective=<b>検知の先の調査・関係者の可視化</b>。Inspectorは脆弱性スキャン。'},
      {s:'S3を非公開のまま、一時的にURLでアクセスさせたい',a:'バケットポリシーを公開に変更',b:'署名付きURL（Presigned URL）',ans:'b',why:'署名付きURL=<b>期限付き一時アクセス</b>。バケット公開は永続で危険。'},
      {s:'Lambda→RDSの接続数が枯渇する',a:'RDS Proxy',b:'マルチAZ',ans:'a',why:'RDS Proxy=<b>コネクションプール</b>。マルチAZは可用性で接続数問題は解決しない。'},
      {s:'APIへのリクエスト数を「クライアントごとに」制限',a:'API Gatewayの使用量プラン',b:'WAFレートベースルール',ans:'a',why:'API GW使用量プラン=<b>APIキー別に上限</b>。WAFはIP単位。'},
      {s:'HPC（密結合ノード間通信）の遅延を最小化',a:'クラスタープレイスメントグループ',b:'スプレッドプレイスメントグループ',ans:'a',why:'クラスター=<b>同一ラック・最低遅延</b>。スプレッドは分散（可用性優先）。'},
    ]
  },

// ===== ロジック =====
// 定着ルール: 間違えた問題は3回連続で正解するまでキューに残す。
// 進捗はlocalStorageに保存し、次回開いたときも「まだ覚えてない問題」を覚えておく。
const MASTER_NEED = 3;          // 間違えた問題が定着するのに必要な連続正解数
const STORE_KEY = 'amida_need_v1';
const EVER_KEY = 'amida_everwrong_v1';  // 一度でも間違えたカードを永久記録（定着しても消さない）

// ----- 一度でも間違えたカードの永久記録（デッキID→[質問文,...]） -----
function loadEver(){
  try { return JSON.parse(localStorage.getItem(EVER_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveEver(o){
  try { localStorage.setItem(EVER_KEY, JSON.stringify(o)); } catch(e){}
}
// 間違えたカードを永久記録に追加（deckIdは現在のデッキ、sは質問文）
function recordEverWrong(deckId, sText){
  const ev = loadEver();
  if(!ev[deckId]) ev[deckId] = [];
  if(!ev[deckId].includes(sText)) ev[deckId].push(sText);
  saveEver(ev);
}
// 全デッキ横断で「一度でも間違えたカード」を集めて配列で返す（重複除去）
function collectEverWrongCards(){
  const ev = loadEver();
  const out = [];
  const seen = new Set();
  Object.entries(ev).forEach(([deckId, list]) => {
    const dk = decks[deckId];
    if(!dk) return; // デッキ再編等でIDが変わった場合はスキップ
    list.forEach(sText => {
      const card = dk.cards.find(c => c.s === sText);
      if(card && !seen.has(sText)){ seen.add(sText); out.push(card); }
    });
  });
  return out;
}
function everWrongTotal(){
  const ev = loadEver();
  let n = 0;
  Object.values(ev).forEach(list => n += list.length);
  return n;
}

let current = null;
let currentId = null;
let queue = [];                 // まだ定着していないカードidxの待ち行列
let needMap = {};               // カードidx → 定着までに必要な残り正解数（<=0で定着）
let missed = new Set();         // 一度でも間違えたカードidx（保存対象）

const $ = id => document.getElementById(id);
function showOnly(id){
  ['top','quiz','result','score'].forEach(s => {
    $(s).style.display = s === id ? 'flex' : 'none';
  });
  if(id==='top') $('top').style.display='block';
}

// ----- localStorage（まだ覚えてない問題を記憶） -----
function loadStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveStore(store){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}
}
// 現在のデッキの「未定着の間違え問題」を質問文(s)をキーに保存
function persistNeed(){
  const store = loadStore();
  const obj = {};
  current.cards.forEach((c,i) => {
    if(missed.has(i) && needMap[i] > 0) obj[c.s] = needMap[i];
  });
  if(Object.keys(obj).length) store[currentId] = obj;
  else delete store[currentId];
  saveStore(store);
}
function pendingCount(id){
  const o = loadStore()[id];
  return o ? Object.keys(o).length : 0;
}

function renderDecks(){
  const wrap = $('decks');
  wrap.innerHTML = '';
  // 「間違えたものモード」ボタン（全デッキ横断・永久記録）
  const ewTotal = everWrongTotal();
  const ew = document.createElement('button');
  ew.className = 'deck';
  ew.style.borderColor = '#b01212';
  ew.innerHTML = `❗️間違えたものモード<span class="cnt">${ewTotal}問</span>` +
    (ewTotal>0 ? `<span class="cnt" style="color:#b01212">これまで間違えた全カード</span>` : `<span class="cnt">まだなし</span>`);
  ew.onclick = () => { if(ewTotal>0) startDeck('__everwrong__'); };
  wrap.appendChild(ew);
  if(ewTotal>0){
    const rst = document.createElement('button');
    rst.className = 'deck'; rst.style.opacity='0.6'; rst.style.fontSize='14px';
    rst.textContent = '🗑 間違え記録をリセット';
    rst.onclick = () => { if(confirm('これまでの「間違えた記録」をすべて消しますか？')){ saveEver({}); renderDecks(); } };
    wrap.appendChild(rst);
  }
  Object.entries(decks).forEach(([id,d]) => {
    const b = document.createElement('button');
    b.className = 'deck';
    const pend = pendingCount(id);
    const badge = pend > 0 ? `<span class="cnt" style="color:#b01212">🔁まだ${pend}問</span>` : '';
    b.innerHTML = `${d.name}<span class="cnt">${d.cards.length}問</span>${badge}`;
    b.onclick = () => startDeck(id);
    wrap.appendChild(b);
  });
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// fresh=true なら保存済みの間違え記録を消してまっさらに始める
function startEverWrongMode(){
  const cards = collectEverWrongCards();
  if(cards.length === 0){ alert('まだ間違えたカードがありません。'); return; }
  // カードに元デッキIDを付与（間違えたら元デッキの記録へ反映するため）
  const ev = loadEver();
  const deckOf = {};
  Object.entries(ev).forEach(([deckId, list]) => list.forEach(sT => { if(deckOf[sT]===undefined) deckOf[sT]=deckId; }));
  cards.forEach(c => { c._deck = deckOf[c.s] || currentId; });
  current = { name:'❗️間違えたものモード', cards, _ever:true };
  currentId = '__everwrong__';
  needMap = {}; missed = new Set();
  cards.forEach((c,i)=> needMap[i]=1);   // 復習は1回正解で一旦クリア（記録自体は永久に残る）
  queue = shuffle(cards.map((_,i)=>i));
  showQ();
}

function startDeck(id, fresh){
  if(id === '__everwrong__'){ startEverWrongMode(); return; }
  current = decks[id];
  currentId = id;
  current._ever = false;
  if(fresh){
    const store = loadStore();
    delete store[id];
    saveStore(store);
  }
  const saved = loadStore()[id] || {};
  needMap = {};
  missed = new Set();
  current.cards.forEach((c,i) => {
    if(saved[c.s] > 0){ needMap[i] = saved[c.s]; missed.add(i); } // 前回の間違えを引き継ぐ
    else { needMap[i] = 1; }                                      // 初見は1回正解で定着
  });
  queue = shuffle(current.cards.map((_,i)=>i));
  showQ();
}

function masteredCount(){
  return current.cards.reduce((n,_,i) => n + (needMap[i] <= 0 ? 1 : 0), 0);
}

function showQ(){
  if(queue.length === 0){ showScore(); return; }
  const c = current.cards[queue[0]];
  $('progress').textContent = `覚えた ${masteredCount()} / ${current.cards.length}　・　残り ${queue.length}`;
  $('situation').textContent = c.s;
  const wrap = $('choices');
  wrap.innerHTML = '';
  // 選択肢を動的に集める（2択でも3択でも対応）＋並びをシャッフル
  const opts = shuffle(['a','b','c'].filter(key => c[key] != null));
  opts.forEach(key => {
    const b = document.createElement('button');
    b.className = 'ch';
    b.textContent = c[key];
    b.onclick = () => answer(key);
    wrap.appendChild(b);
  });
  showOnly('quiz');
}

function answer(picked){
  const i = queue.shift();
  const c = current.cards[i];
  const ok = picked === c.ans;
  if(ok){
    needMap[i]--;
  } else {
    needMap[i] = MASTER_NEED;   // 間違えたら3回連続正解が必要に
    missed.add(i);
    if(current._ever){ recordEverWrong(c._deck, c.s); }  // 間違えたものモード中は元デッキに記録
    else { recordEverWrong(currentId, c.s); }            // 通常デッキは現在のデッキに永久記録
  }
  // まだ定着していなければ待ち行列の後ろに戻す
  if(needMap[i] > 0) queue.splice(Math.min(3, queue.length), 0, i);
  persistNeed();

  $('res-icon').textContent = ok ? '⭕' : '❌';
  let head = ok ? '正解' : '不正解';
  if(ok && needMap[i] <= 0) head = '正解 ✅ 定着！';
  else if(ok) head = `正解 ⭕ あと${needMap[i]}回で定着`;
  else head = `不正解 ❌ ${MASTER_NEED}回連続で正解すると定着`;
  $('res-text').textContent = head;
  $('res-text').className = 'res-text ' + (ok ? 'ok' : 'ng');
  $('res-ans').textContent = '→ ' + c[c.ans];
  $('res-why').innerHTML = c.why;
  showOnly('result');
}

$('nextbtn').onclick = () => showQ();

function showScore(){
  const total = current.cards.length;
  $('score-num').textContent = `${total} / ${total}`;
  $('score-sub').textContent = '🎉 全部定着した！';
  $('score-wrong').style.display = 'none';
  showOnly('score');
}

$('score-retry').onclick = () => startDeck(currentId, true);   // まっさらにもう一度
$('score-back').onclick = () => { renderDecks(); showOnly('top'); };

renderDecks();
showOnly('top');
</script>
